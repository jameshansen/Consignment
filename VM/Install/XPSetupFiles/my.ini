[mysqld]
basedir=C:/MYSQL
datadir=C:/MYSQL/data
default-storage-engine=MyISAM

# The schema is entirely MyISAM. Dropping InnoDB saves 20 MB of tablespace files
# that would otherwise be written on first start, and every written block is one
# the browser has to hold in the block cache.
skip-innodb

# The machine has no network device, so there is no TCP/IP transport to bind to.
# The server listens on a named pipe only; settings.ini passes Protocol=pipe
# through to Connector/Net.
skip-networking
enable-named-pipe
socket=MySQL

[client]
protocol=pipe
socket=MySQL
