; Consignment Manager configuration for the Windows XP demo.
;
; The program reads settings.ini from its working directory, so this belongs
; next to "Multi Express Consignment.exe". Put both on a writable drive: the
; program rewrites this file, which fails if it is running from the CD.

[mysql]
; LiveXP has no TCP/IP transport. The program pastes this value straight into
; "Data Source=<server>;Database=...", so the extra keywords ride along and
; switch Connector/Net to the named pipe MySQL is listening on.
server=.;Protocol=pipe;Pipe Name=MySQL
database=consignment_db
user=root
password=
exportpath=B:\demo\export

[dbase]
path=B:\demo\export

[company]
name=Riverside Consignment
dateFormat=yyyy-MM-dd
status1=Awaiting Pickup
status2=On Hold
branch1Address=1030 Granville Street, Vancouver BC
branch1Telephone=604 555 0100
brandfieldasremarks=false

[startcodes]
consignment=100001
order=200001
upc=100001

[printers]
labelPrinter=
