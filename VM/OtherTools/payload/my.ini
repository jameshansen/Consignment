[mysqld]
basedir=B:/demo/mysql
datadir=B:/demo/mysql/data
default-storage-engine=MyISAM

# The schema is entirely MyISAM. Dropping InnoDB saves 20 MB of tablespace
# files on the CD and a good chunk of the RAM disk it would be copied to.
skip-innodb

# LiveXP has no TCP/IP transport, so the server talks over a named pipe only.
skip-networking
enable-named-pipe
socket=MySQL

[client]
protocol=pipe
socket=MySQL
